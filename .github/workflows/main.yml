name: Despliegue a BanaHosting

on:
  push:
    branches:
      - main  # Se activa cuando subes cambios a la rama main

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: portfolio/package-lock.json

    - name: Build portfolio
      working-directory: portfolio
      run: |
        npm ci
        npm run build:hosting

    - name: Deploy portfolio to site root
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./portfolio/dist/
        server-dir: ./  # Sube el portafolio construido a la raíz configurada en el FTP
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          config.php
          graduacion/**

    - name: Deploy graduation RSVP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./graduacion/
        server-dir: ./graduacion/
